<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODISA FM Live · Nicaragua</title>
<!-- Fuentes Futuristas -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  /* ===== RESET ===== */
  * { margin:0; padding:0; box-sizing:border-box; }

  /* ===== FONDO BASE: ESTUDIO DE RADIO Y BANDERA ===== */
  body {
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden; /* Evita scroll global */
    background: #050a15; 
  }

  /* 1. Capa de la Bandera de Nicaragua (Detrás de todo) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url('bandera.jpg'); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.3; /* Se ve claramente pero no quita protagonismo */
    filter: blur(3px);
    z-index: 0;
    pointer-events: none;
  }

  /* 2. Capa de la Imagen del Estudio de Radio */
  .studio-bg {
    position: fixed;
    inset: 0;
    background-image: url('estudio-radio.jpg'); /* AQUÍ DEBES PONER LA IMAGEN QUE ME ENVIASTE */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 1;
    pointer-events: none;
  }

  /* 3. Capa oscura para que el neón resalte sobre el estudio */
  .overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(5,10,21,0.2) 0%, rgba(5,10,21,0.85) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* ===== CANVAS DE EFECTOS (Luciérnagas y explosiones) ===== */
  #fx-canvas {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  /* ===== CONTENIDO PRINCIPAL ===== */
  header, .main-content, .cards-wrapper, footer { position: relative; z-index: 4; }

  /* CONTENEDOR CENTRAL (Para posicionar el letrero ON AIR) */
  .main-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 100vh;
    width: 100%;
    padding: 30px 20px 50px;
  }

  /* ===== EL LETRERO ON AIR ===== */
  .on-air-sign {
    margin-top: 5vh; /* Ajusta la altura del letrero */
    background: rgba(15, 5, 25, 0.85);
    border: 4px solid #ff007f;
    border-radius: 12px;
    padding: 15px 40px;
    box-shadow: 
      0 0 20px #ff007f, 
      inset 0 0 20px #ff007f,
      0 0 40px rgba(255, 0, 127, 0.5);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* El texto interior */
  .on-air-sign h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-shadow: 
      0 0 10px #ffffff,
      0 0 20px #ff007f,
      0 0 40px #ff007f;
    animation: neonFlicker 2s infinite alternate;
  }

  /* Subtítulo pequeño */
  .on-air-sign p {
    font-size: 0.9rem;
    color: #ffb3d9;
    letter-spacing: 3px;
    margin-top: 5px;
    text-shadow: 0 0 5px #ff007f;
  }

  /* Efecto de parpadeo de neón real */
  @keyframes neonFlicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.6; }
  }

  /* ===== CONTENEDOR DE LAS 5 TARJETAS ===== */
  .cards-wrapper {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: stretch;
    gap: 20px; 
    width: 100%;
    max-width: 1150px;
    overflow-x: auto;
    padding: 20px 10px;
    scrollbar-width: none; /* Ocultar barra de scroll en Firefox */
  }
  .cards-wrapper::-webkit-scrollbar { display: none; } /* Ocultar barra en Chrome/Safari */

  /* Tarjeta Individual (Estilo Tecla 3D) */
  .card {
    flex: 0 0 190px;
    position: relative;
    background: rgba(8, 14, 26, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 25px 15px 20px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    overflow: hidden;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    
    transition: all 0.12s cubic-bezier(0.25, 0.8, 0.25, 1);
    
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    
    box-shadow: 
      0 8px 0 rgba(0, 0, 0, 0.9), 
      0 15px 20px rgba(0,0,0,0.6); 
  }

  /* Línea superior de neón */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--glow);
    box-shadow: 0 0 15px var(--glow);
    transition: all 0.12s ease;
  }

  /* EFECTO PIANO AL PASAR EL MOUSE (Se hunde) */
  .card:hover {
    transform: translateY(6px); 
    border-color: var(--glow);
    box-shadow: 
      0 2px 0 rgba(0, 0, 0, 0.9), 
      0 5px 10px rgba(0,0,0,0.6),
      inset 0 0 20px rgba(255, 255, 255, 0.05); 
    background: rgba(12, 20, 35, 0.95);
    z-index: 10;
  }
  
  .card:hover::before { 
    height: 6px;
    box-shadow: 0 0 25px var(--glow), 0 0 10px var(--glow);
  }

  /* CONTENEDOR DEL LOGO */
  .logo-container {
    width: 95px;
    height: 95px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #0a1120; 
    border: 2px solid rgba(255, 255, 255, 0.2);
    padding: 5px;
    transition: all 0.3s ease;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    z-index: 2;
  }

  .logo-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
    transition: transform 0.3s ease, filter 0.3s ease;
  }

  .card:hover .logo-container {
    border-color: var(--glow);
    box-shadow: inset 0 0 20px var(--glow), 0 0 15px var(--glow);
  }

  .card:hover .logo-container img {
    transform: scale(1.1);
    filter: drop-shadow(0 0 10px var(--glow));
  }

  /* TEXTOS */
  .card h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 5px;
    transition: color 0.3s ease;
    z-index: 2;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }

  .card:hover h2 {
    color: var(--glow);
    text-shadow: 0 0 10px var(--glow);
  }

  .card .tag {
    font-size: 0.8rem;
    color: #8ba3c7;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    z-index: 2;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }

  .card:hover .tag { color: #ffffff; }

  /* BOTÓN EN VIVO */
  .live {
    margin-top: 12px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 2px;
    color: var(--glow);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0.8;
    transition: opacity 0.3s ease;
    z-index: 2;
  }

  .card:hover .live { opacity: 1; }

  .live::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 10px var(--glow);
    animation: blink 1s infinite alternate;
  }

  @keyframes blink { 100% { opacity: 0.2; } }

  /* ===== COLORES DE LOS LOGOS ===== */
  .futura  { --glow: #00d2ff; }
  .viva    { --glow: #ff2d55; }
  .shock   { --glow: #ff7300; }
  .tuani   { --glow: #ffd700; }
  .clasica { --glow: #9d00ff; }

  footer {
    margin-top: 15px;
    color: #ffffff;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    text-shadow: 0 2px 5px rgba(0,0,0,1);
    opacity: 0.5;
  }

  /* Ajustes para móviles */
  @media (max-width: 768px) {
    .main-content { padding: 20px 10px; }
    .on-air-sign { padding: 10px 20px; margin-top: 2vh; }
    .cards-wrapper { justify-content: flex-start; padding-bottom: 10px; gap: 15px; }
    .card { flex: 0 0 160px; padding: 15px 10px 12px; }
    .logo-container { width: 75px; height: 75px; }
    .card h2 { font-size: 0.9rem; }
  }
</style>
</head>
<body>

  <!-- Capas de Fondo -->
  <div class="studio-bg"></div>
  <div class="overlay"></div>

  <!-- Canvas para las notas musicales -->
  <canvas id="fx-canvas"></canvas>

  <!-- Contenido Principal -->
  <div class="main-content">
    
    <!-- El Letrero ON AIR -->
    <div class="on-air-sign">
      <h1>CODISA ON AIR</h1>
      <p>Nicaragua · 24/7</p>
    </div>

    <!-- Las 5 Tarjetas de Radio -->
    <div class="cards-wrapper">

      <!-- 1. FUTURA 91.3 FM -->
      <a class="card futura" href="https://radiofuturanicaragua.com/" target="_blank" rel="noopener">
        <div class="logo-container" id="logo-futura" data-note="261.63">
          <img src="logo-futura.png" alt="Futura 91.3 FM" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#00d2ff;font-family:Orbitron;font-size:20px;font-weight:bold;\'>91.3</span>';">
        </div>
        <h2>91.3 FM</h2>
        <span class="tag">Futura</span>
        <div class="live">EN VIVO</div>
      </a>

      <!-- 2. VIVA 98.3 FM -->
      <a class="card viva" href="https://viva983fm.com/" target="_blank" rel="noopener">
        <div class="logo-container" id="logo-viva" data-note="293.66">
          <img src="logo-viva.png" alt="VIVA 98.3 FM" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#ff2d55;font-family:Orbitron;font-size:20px;font-weight:bold;\'>98.3</span>';">
        </div>
        <h2>98.3 FM</h2>
        <span class="tag">VIVA</span>
        <div class="live">EN VIVO</div>
      </a>

      <!-- 3. SHOCK 99.5 FM -->
      <a class="card shock" href="https://shock.ksoftech.com/" target="_blank" rel="noopener">
        <div class="logo-container" id="logo-shock" data-note="329.63">
          <img src="logo-shock.png" alt="Shock 99.5 FM" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#ff7300;font-family:Orbitron;font-size:20px;font-weight:bold;\'>99.5</span>';">
        </div>
        <h2>99.5 FM</h2>
        <span class="tag">Shock</span>
        <div class="live">EN VIVO</div>
      </a>

      <!-- 4. LA TUANI 100.3 FM -->
      <a class="card tuani" href="https://www.latuani.com.ni/" target="_blank" rel="noopener">
        <div class="logo-container" id="logo-tuani" data-note="349.23">
          <img src="logo-tuani.png" alt="La Tuani 100.3 FM" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#ffd700;font-family:Orbitron;font-size:20px;font-weight:bold;\'>100.3</span>';">
        </div>
        <h2>100.3 FM</h2>
        <span class="tag">La Tuani</span>
        <div class="live">EN VIVO</div>
      </a>

      <!-- 5. CLÁSICA 101.9 FM -->
      <a class="card clasica" href="https://clasica1019fm.com/" target="_blank" rel="noopener">
        <div class="logo-container" id="logo-clasica" data-note="392.00">
          <img src="logo-clasica.png" alt="Clásica 101.9 FM" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#9d00ff;font-family:Orbitron;font-size:20px;font-weight:bold;\'>101.9</span>';">
        </div>
        <h2>101.9 FM</h2>
        <span class="tag">Clásica</span>
        <div class="live">EN VIVO</div>
      </a>

    </div>

    <footer>© 2026 · CODISA FM Live</footer>
  </div>

  <!-- ===== SCRIPT DE EFECTOS VISUALES Y AUDIO ===== -->
  <script>
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    const notes = ['🎵', '🎶', '🎧', '♪', '♫', '♬', '♩'];
    const colors = ['#00d2ff', '#ff2d55', '#ff7300', '#ffd700', '#9d00ff', '#ffffff'];

    // --- SISTEMA DE AUDIO (Efecto Piano) ---
    let audioCtx = null;

    function playNote(frequency) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      oscillator.type = 'sine'; 
      oscillator.frequency.value = frequency; 
      
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
      
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 1.5);
    }

    // --- PARTÍCULAS (Hover y Clic) ---
    let explosions = [];

    class ExplosionParticle {
      constructor(x, y, isHover = false) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        
        const speed = isHover ? (Math.random() * 6 + 2) : (Math.random() * 12 + 4);
        
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        this.gravity = isHover ? 0.15 : 0.25;
        this.friction = 0.95;
        this.size = isHover ? (Math.random() * 12 + 10) : (Math.random() * 18 + 12);
        
        this.note = notes[Math.floor(Math.random() * notes.length)];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.opacity = 1;
        this.decay = isHover ? (Math.random() * 0.03 + 0.02) : (Math.random() * 0.02 + 0.01);
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.3;
      }
      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotSpeed;
        this.opacity -= this.decay;
      }
      draw() {
        if (this.opacity <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.font = `${this.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        ctx.fillText(this.note, 0, 0);
        ctx.restore();
      }
    }

    // --- CONFIGURACIÓN DEL CANVAS ---
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let i = explosions.length - 1; i >= 0; i--) {
        explosions[i].update();
        explosions[i].draw();
        if (explosions[i].opacity <= 0) explosions.splice(i, 1);
      }
      requestAnimationFrame(animate);
    }
    animate();

    // --- INTERACCIÓN CON LAS TARJETAS ---
    const cards = document.querySelectorAll('.card');
    
    cards.forEach(card => {
      const logo = card.querySelector('.logo-container');
      const noteFreq = parseFloat(logo.getAttribute('data-note'));

      // Efecto Hover: Suena y salen notas
      card.addEventListener('mouseenter', () => {
        playNote(noteFreq);
        const rect = logo.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        for (let i = 0; i < 15; i++) {
          explosions.push(new ExplosionParticle(centerX, centerY, true));
        }
      });

      // Efecto Clic: Explosión grande
      logo.addEventListener('click', function(e) {
        playNote(noteFreq);
        const rect = this.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        for (let i = 0; i < 40; i++) {
          explosions.push(new ExplosionParticle(centerX, centerY, false));
        }
      });
    });
  </script>
</body>
</html>
