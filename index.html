<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODISA FM Live · Nicaragua</title>
<!-- Fuentes Futuristas -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  /* ===== RESET ===== */
  * { margin:0; padding:0; box-sizing:border-box; }

  /* ===== FONDO BASE: LA BANDERA ===== */
  body {
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
    background: #050a15; 
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url('bandera.jpg'); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.85; 
    z-index: 0;
    pointer-events: none;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(5,10,21,0.2) 0%, rgba(5,10,21,0.6) 50%, rgba(5,10,21,0.9) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* ===== CANVAS DE EFECTOS ===== */
  #fx-canvas {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  /* ===== BOTÓN DESBLOQUEADOR DE AUDIO ===== */
  .audio-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    background: rgba(0, 0, 0, 0.7);
    color: #ffcc00;
    border: 2px solid #ffcc00;
    padding: 10px 20px;
    border-radius: 30px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .audio-btn:hover {
    background: #ffcc00;
    color: #000;
    box-shadow: 0 0 25px #ffcc00;
  }
  .audio-btn.active {
    border-color: #00ff88;
    color: #00ff88;
    box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
  }
  .audio-btn.active:hover {
    background: #00ff88;
    color: #000;
  }

  /* ===== LA MASCOTA CODISA (EFECTO FLOTANTE) ===== */
  .mascota-container {
    position: absolute;
    left: 4%; /* Posicionada a la izquierda */
    top: 50%;
    transform: translateY(-50%);
    width: 320px;
    z-index: 4;
    pointer-events: none; /* Para que no bloquee los clics */
    animation: flotar 4s ease-in-out infinite;
  }

  .mascota-container img {
    width: 100%;
    height: auto;
    /* El mix-blend-mode hace que el fondo blanco desaparezca mágicamente */
    mix-blend-mode: multiply; 
    /* Resplandor azul/blanco estilo neón */
    filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4)) contrast(110%);
  }

  @keyframes flotar {
    0%, 100% { transform: translateY(-50%); }
    50% { transform: translateY(-55%); }
  }

  /* ===== CONTENIDO PRINCIPAL ===== */
  header, .cards-wrapper, footer { position: relative; z-index: 3; }

  header { text-align:center; margin-bottom: 30px; }

  /* ===== EL LETRERO CODISA ON AIR ===== */
  .on-air-sign {
    display: inline-block;
    background: rgba(10, 5, 0, 0.9); 
    border: 5px solid #ffcc00; 
    border-radius: 12px;
    padding: 15px 45px;
    margin-bottom: 20px;
    box-shadow: 
      0 0 20px #ffcc00, 
      inset 0 0 20px #ffcc00,
      0 0 50px rgba(255, 204, 0, 0.6);
    animation: signFlicker 2s infinite alternate;
  }

  .on-air-sign h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2.2rem, 6vw, 4rem);
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 5px;
    text-shadow: 
      0 0 10px #ffffff,
      0 0 20px #ffcc00,
      0 0 40px #ffcc00;
  }

  .on-air-sign p {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    color: #ffe066;
    letter-spacing: 6px;
    margin-top: 5px;
    text-transform: uppercase;
    font-weight: 700;
    text-shadow: 0 0 10px #ffcc00;
  }

  @keyframes signFlicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { 
      opacity: 1; 
      box-shadow: 0 0 20px #ffcc00, inset 0 0 20px #ffcc00, 0 0 50px rgba(255, 204, 0, 0.6);
    }
    20%, 24%, 55% { 
      opacity: 0.8; 
      box-shadow: 0 0 10px #ffcc00, inset 0 0 10px #ffcc00, 0 0 20px rgba(255, 204, 0, 0.3);
    }
  }

  header p.subtitle {
    margin-top: 10px;
    color: #ffffff;
    font-size: clamp(1rem, 2vw, 1.2rem);
    letter-spacing: 6px;
    text-transform: uppercase;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0,0,0,1);
  }

  /* ===== CONTENEDOR DE LAS 5 TARJETAS ===== */
  .cards-wrapper {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: stretch;
    gap: 25px; 
    width: 100%;
    max-width: 1200px;
    overflow-x: auto;
    padding: 20px 10px 40px; 
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.4) transparent;
  }

  .cards-wrapper::-webkit-scrollbar { height: 6px; }
  .cards-wrapper::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 10px; }

  /* Tarjeta Individual */
  .card {
    flex: 0 0 200px;
    position: relative;
    background: rgba(8, 14, 26, 0.85); 
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 30px 15px 25px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    overflow: hidden;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    
    transition: all 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
    
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    
    box-shadow: 
      0 8px 0 rgba(0, 0, 0, 0.8), 
      0 15px 20px rgba(0,0,0,0.6); 
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--glow);
    box-shadow: 0 0 15px var(--glow);
    transition: all 0.15s ease;
  }

  /* EFECTO PIANO AL PASAR EL MOUSE */
  .card:hover {
    transform: translateY(6px); 
    border-color: var(--glow);
    box-shadow: 
      0 2px 0 rgba(0, 0, 0, 0.8), 
      0 5px 10px rgba(0,0,0,0.6),
      inset 0 0 20px rgba(255, 255, 255, 0.05); 
    background: rgba(12, 20, 35, 0.95);
    z-index: 10;
  }
  
  .card:hover::before { 
    height: 6px;
    box-shadow: 0 0 25px var(--glow), 0 0 10px var(--glow);
  }

  /* ===== EL CÍRCULO BLANCO DEL LOGO ===== */
  .logo-container {
    width: 105px;
    height: 105px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #ffffff; 
    border: 3px solid rgba(255, 255, 255, 0.8);
    padding: 8px; 
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
    box-shadow: 
      0 4px 6px rgba(0,0,0,0.3),
      inset 0 0 10px rgba(0,0,0,0.1);
    z-index: 2;
  }

  .logo-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
  }

  /* ===== EFECTO 3D DE ALTA CALIDAD AL PASAR EL MOUSE ===== */
  .card:hover .logo-container {
    transform: translateY(-10px) scale(1.1);
    box-shadow: 
      0 15px 25px rgba(0,0,0,0.4), 
      0 5px 10px rgba(0,0,0,0.3), 
      0 0 25px var(--glow), 
      0 0 40px var(--glow), 
      inset 0 -4px 8px rgba(0,0,0,0.1); 
  }

  .card:hover .logo-container img {
    transform: scale(1.05);
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)) drop-shadow(0 0 15px var(--glow));
  }

  /* TEXTOS */
  .card h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 5px;
    transition: color 0.3s ease;
    z-index: 2;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }

  .card:hover h2 {
    color: var(--glow);
    text-shadow: 0 0 10px var(--glow);
  }

  .card .tag {
    font-size: 0.85rem;
    color: #8ba3c7;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
    z-index: 2;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }

  .card:hover .tag {
    color: #ffffff;
  }

  /* BOTÓN EN VIVO */
  .live {
    margin-top: 15px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 2px;
    color: var(--glow);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0.8;
    transition: opacity 0.3s ease;
    z-index: 2;
  }

  .card:hover .live { opacity: 1; }

  .live::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 10px var(--glow);
    animation: blink 1s infinite alternate;
  }

  @keyframes blink { 100% { opacity: 0.2; } }

  /* ===== COLORES DE LOS LOGOS ===== */
  .futura  { --glow: #00d2ff; }
  .viva    { --glow: #ff2d55; }
  .shock   { --glow: #ff7300; }
  .tuani   { --glow: #ffd700; }
  .clasica { --glow: #9d00ff; }

  footer {
    margin-top: 20px;
    color: #ffffff;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    text-shadow: 0 2px 5px rgba(0,0,0,1);
    opacity: 0.8;
  }

  /* Ajustes para móviles */
  @media (max-width: 1200px) {
    /* En pantallas más pequeñas, movemos la mascota arriba y la hacemos más pequeña */
    .mascota-container {
      position: relative;
      left: auto;
      top: auto;
      transform: none;
      width: 180px;
      margin-bottom: -20px;
      animation: flotar-movil 4s ease-in-out infinite;
    }
    @keyframes flotar-movil {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  }

  @media (max-width: 768px) {
    .cards-wrapper { justify-content: flex-start; padding-bottom: 20px; }
    .card { flex: 0 0 170px; padding: 20px 10px 15px; }
    .logo-container { width: 85px; height: 85px; padding: 6px; }
    .on-air-sign { padding: 10px 20px; }
    .audio-btn { top: 10px; right: 10px; font-size: 0.7rem; padding: 8px 15px; }
  }
</style>
</head>
<body>

  <!-- Botón para desbloquear el audio -->
  <button id="unlock-btn" class="audio-btn">🔊 ACTIVAR SONIDO</button>

  <canvas id="fx-canvas"></canvas>

  <!-- AQUÍ ESTÁ LA MASCOTA -->
  <div class="mascota-container">
    <img src="mascota-codisa.png" alt="Mascota CODISA">
  </div>

  <header>
    <div class="on-air-sign">
      <h1>CODISA ON AIR</h1>
      <p>Nicaragua · 24/7</p>
    </div>
    <p class="subtitle">Nicaragua · En vivo 24/7</p>
  </header>

  <div class="cards-wrapper">

    <!-- 1. FUTURA 91.3 FM -->
    <a class="card futura" href="https://radiofuturanicaragua.com/" target="_blank" rel="noopener">
      <div class="logo-container" id="logo-futura" data-note="261.63">
        <img src="logo-futura.png" alt="Futura 91.3 FM" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#00d2ff;font-family:Orbitron;font-size:22px;font-weight:bold;\'>91.3</span>';">
      </div>
      <h2>91.3 FM</h2>
      <span class="tag">Futura</span>
      <div class="live">EN VIVO</div>
    </a>

    <!-- 2. VIVA 98.3 FM -->
    <a class="card viva" href="https://viva983fm.com/" target="_blank" rel="noopener">
      <div class="logo-container" id="logo-viva" data-note="293.66">
        <img src="logo-viva.png" alt="VIVA 98.3 FM" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#ff2d55;font-family:Orbitron;font-size:22px;font-weight:bold;\'>98.3</span>';">
      </div>
      <h2>98.3 FM</h2>
      <span class="tag">VIVA</span>
      <div class="live">EN VIVO</div>
    </a>

    <!-- 3. SHOCK 99.5 FM -->
    <a class="card shock" href="https://shock.ksoftech.com/" target="_blank" rel="noopener">
      <div class="logo-container" id="logo-shock" data-note="329.63">
        <img src="logo-shock.png" alt="Shock 99.5 FM" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#ff7300;font-family:Orbitron;font-size:22px;font-weight:bold;\'>99.5</span>';">
      </div>
      <h2>99.5 FM</h2>
      <span class="tag">Shock</span>
      <div class="live">EN VIVO</div>
    </a>

    <!-- 4. LA TUANI 100.3 FM -->
    <a class="card tuani" href="https://www.latuani.com.ni/" target="_blank" rel="noopener">
      <div class="logo-container" id="logo-tuani" data-note="349.23">
        <img src="logo-tuani.png" alt="La Tuani 100.3 FM" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#ffd700;font-family:Orbitron;font-size:22px;font-weight:bold;\'>100.3</span>';">
      </div>
      <h2>100.3 FM</h2>
      <span class="tag">La Tuani</span>
      <div class="live">EN VIVO</div>
    </a>

    <!-- 5. CLÁSICA 101.9 FM -->
    <a class="card clasica" href="https://clasica1019fm.com/" target="_blank" rel="noopener">
      <div class="logo-container" id="logo-clasica" data-note="392.00">
        <img src="logo-clasica.png" alt="Clásica 101.9 FM" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#9d00ff;font-family:Orbitron;font-size:22px;font-weight:bold;\'>101.9</span>';">
      </div>
      <h2>101.9 FM</h2>
      <span class="tag">Clásica</span>
      <div class="live">EN VIVO</div>
    </a>

  </div>

  <footer>© 2026 · CODISA FM Live</footer>

  <!-- ===== SCRIPT DE EFECTOS VISUALES Y AUDIO ===== -->
  <script>
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    const notes = ['🎵', '🎶', '🎧', '♪', '♫', '♬', '♩'];
    const colors = ['#00d2ff', '#ff2d55', '#ff7300', '#ffd700', '#9d00ff', '#ffffff'];

    // --- SISTEMA DE AUDIO ---
    let audioCtx = null;
    const unlockBtn = document.getElementById('unlock-btn');

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(() => {
          unlockBtn.textContent = "🔇 SONIDO ACTIVO";
          unlockBtn.classList.add('active');
          setTimeout(() => { unlockBtn.style.opacity = '0'; }, 3000);
        });
      }
    }

    unlockBtn.addEventListener('click', unlockAudio);

    function playNote(frequency) {
      if (!audioCtx || audioCtx.state === 'suspended') return; 
      
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      oscillator.type = 'sine'; 
      oscillator.frequency.value = frequency; 
      
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
      
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 1.5);
    }

    // --- LUCIÉRNAGAS DE FONDO ---
    let fireflies = [];

    class Firefly {
      constructor() { this.reset(true); }
      reset(init = false) {
        this.x = Math.random() * width;
        this.y = init ? Math.random() * height : height + 50;
        this.size = Math.random() * 15 + 10;
        this.speedY = Math.random() * 1 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.note = notes[Math.floor(Math.random() * notes.length)];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.opacity = 0;
        this.maxOpacity = Math.random() * 0.5 + 0.1;
        this.fadeState = 'in';
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
        this.wobble = Math.random() * Math.PI * 2;
      }
      update() {
        this.y -= this.speedY;
        this.wobble += 0.02;
        this.x += Math.sin(this.wobble) * 0.5 + this.speedX;
        this.rotation += this.rotSpeed;
        if (this.fadeState === 'in') {
          this.opacity += 0.01;
          if (this.opacity >= this.maxOpacity) this.fadeState = 'out';
        } else {
          this.opacity -= 0.005;
        }
        if (this.opacity <= 0 || this.y < -50 || this.x < -50 || this.x > width + 50) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.font = `${this.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fillText(this.note, 0, 0);
        ctx.restore();
      }
    }

    // --- PARTÍCULAS DE EXPLOSIÓN Y HOVER ---
    let explosions = [];

    class ExplosionParticle {
      constructor(x, y, isHover = false) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = isHover ? (Math.random() * 6 + 2) : (Math.random() * 12 + 4);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.gravity = isHover ? 0.15 : 0.25;
        this.friction = 0.95;
        this.size = isHover ? (Math.random() * 12 + 10) : (Math.random() * 18 + 12);
        this.note = notes[Math.floor(Math.random() * notes.length)];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.opacity = 1;
        this.decay = isHover ? (Math.random() * 0.03 + 0.02) : (Math.random() * 0.02 + 0.01);
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.3;
      }
      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotSpeed;
        this.opacity -= this.decay;
      }
      draw() {
        if (this.opacity <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.font = `${this.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        ctx.fillText(this.note, 0, 0);
        ctx.restore();
      }
    }

    // --- CONFIGURACIÓN DEL CANVAS ---
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const fireflyCount = window.innerWidth < 768 ? 30 : 70;
    for (let i = 0; i < fireflyCount; i++) {
      fireflies.push(new Firefly());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      fireflies.forEach(f => { f.update(); f.draw(); });
      for (let i = explosions.length - 1; i >= 0; i--) {
        explosions[i].update();
        explosions[i].draw();
        if (explosions[i].opacity <= 0) explosions.splice(i, 1);
      }
      requestAnimationFrame(animate);
    }
    animate();

    // --- INTERACCIÓN CON LAS TARJETAS ---
    const cards = document.querySelectorAll('.card');
    
    cards.forEach(card => {
      const logo = card.querySelector('.logo-container');
      const noteFreq = parseFloat(logo.getAttribute('data-note'));

      card.addEventListener('mouseenter', () => {
        playNote(noteFreq);
        const rect = logo.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        for (let i = 0; i < 15; i++) {
          explosions.push(new ExplosionParticle(centerX, centerY, true));
        }
      });

      logo.addEventListener('click', function(e) {
        playNote(noteFreq);
        const rect = this.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        for (let i = 0; i < 40; i++) {
          explosions.push(new ExplosionParticle(centerX, centerY, false));
        }
      });
    });
  </script>
</body>
</html>
